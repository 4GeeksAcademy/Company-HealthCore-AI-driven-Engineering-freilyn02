<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apply | HealthCore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="m-0 box-border bg-[radial-gradient(circle_at_top_left,rgba(255,106,61,0.12),transparent_30%),linear-gradient(180deg,#fff8ef_0%,#f3ede5_100%)] font-[Manrope] leading-[1.6] text-[#101010]">

  <header class="sticky top-0 z-[100] flex items-center justify-between gap-4 border-b border-[rgba(16,16,16,0.06)] bg-[rgba(255,250,243,0.82)] px-[5%] py-[18px] backdrop-blur-[14px] min-[721px]:px-[8%]">
    <a href="index.html" class="font-[Space_Grotesk] text-[1.55rem] font-bold tracking-[-0.04em] text-[#101010] no-underline">Health<span class="text-[#ff6a3d]">Core</span></a>
    <a href="index.html" class="font-semibold text-[#101010] no-underline hover:text-[#ff6a3d]">Back to home</a>
  </header>

  <section class="px-[5%] py-[64px] min-[721px]:px-[8%]">
    <div class="mx-auto max-w-[720px]">
      <p class="mb-[18px] inline-block text-[0.78rem] font-extrabold uppercase tracking-[0.14em] text-[#ff6a3d]">Careers</p>
      <h1 class="mb-4 font-[Space_Grotesk] text-[clamp(2rem,4vw,3.4rem)] leading-none tracking-[-0.05em]">Apply to HealthCore</h1>
      <p class="mb-8 text-[#5f5a54]">Tell us about yourself. Fields marked with * are required.</p>

      <form id="application-form" novalidate class="grid gap-6 rounded-[28px] border border-[rgba(16,16,16,0.06)] bg-white/85 p-[32px] shadow-[0_20px_50px_rgba(16,16,16,0.06)]">

        <fieldset class="grid gap-5">
          <legend class="mb-2 text-[0.82rem] font-extrabold uppercase tracking-[0.12em] text-[#5f5a54]">Personal information</legend>

          <div>
            <label for="full_name" class="mb-2 block text-[0.82rem] font-extrabold uppercase tracking-[0.12em] text-[#5f5a54]">Full name *</label>
            <input id="full_name" name="full_name" type="text" required aria-describedby="full_name-error" aria-invalid="false" class="w-full rounded-xl border border-[rgba(16,16,16,0.14)] bg-white px-4 py-3 text-[#101010] outline-none transition focus:border-[#ff6a3d] focus:ring-2 focus:ring-[#ff6a3d]/20" />
            <p id="full_name-error" class="mt-2 text-sm font-semibold text-[#b3261e]" aria-live="polite"></p>
          </div>

          <div>
            <label for="email" class="mb-2 block text-[0.82rem] font-extrabold uppercase tracking-[0.12em] text-[#5f5a54]">Email *</label>
            <input id="email" name="email" type="email" required aria-describedby="email-error" aria-invalid="false" class="w-full rounded-xl border border-[rgba(16,16,16,0.14)] bg-white px-4 py-3 text-[#101010] outline-none transition focus:border-[#ff6a3d] focus:ring-2 focus:ring-[#ff6a3d]/20" />
            <p id="email-error" class="mt-2 text-sm font-semibold text-[#b3261e]" aria-live="polite"></p>
          </div>

          <div>
            <label for="phone" class="mb-2 block text-[0.82rem] font-extrabold uppercase tracking-[0.12em] text-[#5f5a54]">Phone *</label>
            <input id="phone" name="phone" type="tel" required aria-describedby="phone-error" aria-invalid="false" placeholder="+1 555 123 4567" class="w-full rounded-xl border border-[rgba(16,16,16,0.14)] bg-white px-4 py-3 text-[#101010] outline-none transition focus:border-[#ff6a3d] focus:ring-2 focus:ring-[#ff6a3d]/20" />
            <p id="phone-error" class="mt-2 text-sm font-semibold text-[#b3261e]" aria-live="polite"></p>
          </div>
        </fieldset>

        <fieldset class="grid gap-5">
          <legend class="mb-2 text-[0.82rem] font-extrabold uppercase tracking-[0.12em] text-[#5f5a54]">Position</legend>

          <div>
            <label for="position" class="mb-2 block text-[0.82rem] font-extrabold uppercase tracking-[0.12em] text-[#5f5a54]">Position you're applying for *</label>
            <select id="position" name="position" required aria-describedby="position-error" aria-invalid="false" class="w-full rounded-xl border border-[rgba(16,16,16,0.14)] bg-white px-4 py-3 text-[#101010] outline-none transition focus:border-[#ff6a3d] focus:ring-2 focus:ring-[#ff6a3d]/20">
              <option value="">Select a position</option>
              <option value="registered_nurse">Registered Nurse</option>
              <option value="patient_coordinator">Patient Coordinator</option>
              <option value="clinic_operations_manager">Clinic Operations Manager</option>
              <option value="executive_assistant">Executive Assistant</option>
            </select>
            <p id="position-error" class="mt-2 text-sm font-semibold text-[#b3261e]" aria-live="polite"></p>
          </div>

          <div>
            <label for="experience_years" class="mb-2 block text-[0.82rem] font-extrabold uppercase tracking-[0.12em] text-[#5f5a54]">Years of experience *</label>
            <input id="experience_years" name="experience_years" type="number" min="0" required aria-describedby="experience_years-error" aria-invalid="false" class="w-full rounded-xl border border-[rgba(16,16,16,0.14)] bg-white px-4 py-3 text-[#101010] outline-none transition focus:border-[#ff6a3d] focus:ring-2 focus:ring-[#ff6a3d]/20" />
            <p id="experience_years-error" class="mt-2 text-sm font-semibold text-[#b3261e]" aria-live="polite"></p>
          </div>
        </fieldset>

        <fieldset class="grid gap-5">
          <legend class="mb-2 text-[0.82rem] font-extrabold uppercase tracking-[0.12em] text-[#5f5a54]">Optional links</legend>

          <div>
            <label for="linkedin_url" class="mb-2 block text-[0.82rem] font-extrabold uppercase tracking-[0.12em] text-[#5f5a54]">LinkedIn URL</label>
            <input id="linkedin_url" name="linkedin_url" type="url" aria-describedby="linkedin_url-error" aria-invalid="false" placeholder="https://linkedin.com/in/..." class="w-full rounded-xl border border-[rgba(16,16,16,0.14)] bg-white px-4 py-3 text-[#101010] outline-none transition focus:border-[#ff6a3d] focus:ring-2 focus:ring-[#ff6a3d]/20" />
            <p id="linkedin_url-error" class="mt-2 text-sm font-semibold text-[#b3261e]" aria-live="polite"></p>
          </div>

          <div>
            <label for="cv_url" class="mb-2 block text-[0.82rem] font-extrabold uppercase tracking-[0.12em] text-[#5f5a54]">CV / Resume URL</label>
            <input id="cv_url" name="cv_url" type="url" aria-describedby="cv_url-error" aria-invalid="false" placeholder="https://..." class="w-full rounded-xl border border-[rgba(16,16,16,0.14)] bg-white px-4 py-3 text-[#101010] outline-none transition focus:border-[#ff6a3d] focus:ring-2 focus:ring-[#ff6a3d]/20" />
            <p id="cv_url-error" class="mt-2 text-sm font-semibold text-[#b3261e]" aria-live="polite"></p>
          </div>
        </fieldset>

        <p id="form-status" class="text-sm font-semibold text-[#5f5a54]" role="status" aria-live="polite"></p>

        <div class="flex flex-wrap gap-[14px]">
          <button type="submit" class="inline-flex min-h-[52px] items-center justify-center rounded-full bg-[#ff6a3d] px-6 py-3 font-extrabold text-white transition hover:-translate-y-0.5 hover:bg-[#e4542c]">Submit application</button>
          <button type="reset" class="inline-flex min-h-[52px] items-center justify-center rounded-full border border-[rgba(16,16,16,0.12)] bg-white px-6 py-3 font-extrabold text-[#101010] transition hover:-translate-y-0.5">Clear</button>
        </div>
      </form>
    </div>
  </section>

  <footer class="border-t border-[rgba(16,16,16,0.06)] px-5 py-7 text-center text-[0.9rem] text-[#5f5a54]">
    <p>&copy; 2026 HealthCore Digital. Outpatient care across the US and UK.</p>
  </footer>

  <script src="validation.js" defer></script>
</body>
</html>
