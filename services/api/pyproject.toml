[project]
name = "supplier-directory-api"
version = "0.1.0"
description = "HealthCore Supplier Directory - Lightweight Storage API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "tinydb>=4.8.0",
    "python-jose[cryptography]>=3.5.0",
    "passlib[bcrypt]>=1.7.4",
    "python-dotenv>=1.2.2",
    "bcrypt==4.0.1",
    "python-multipart>=0.0.32",
]

[tool.uv]
package = false
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
