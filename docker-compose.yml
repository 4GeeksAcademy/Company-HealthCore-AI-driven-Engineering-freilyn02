services:
  uis:
    build:
      context: ./uis
    ports:
      - "3000:3000"
      - "3001:3001"
    volumes:
      - ./uis:/uis
      - /uis/website/node_modules
      - /uis/backoffice/node_modules
      - /uis/website/.next
      - /uis/backoffice/.next
    env_file:
      - .env
    networks:
      - monorepo-dev

  services:
    build:
      context: ./services/api
    ports:
      - "8000:8000"
    volumes:
      - ./services/api:/app
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      # Inside the Compose network Qdrant is reachable by its service name.
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - redis
      - qdrant
    networks:
      - monorepo-dev

  redis:
    image: redis:7-alpine
    # Bound to loopback: Redis has no password, so it must never be reachable from the
    # network. Other containers reach it through the Compose network (redis:6379).
    ports:
      - "127.0.0.1:6379:6379"
    # noeviction: if Redis runs out of memory, it refuses new writes instead
    # of silently deleting queued messages. For a task queue, losing a
    # message is worse than a write failing loudly.
    command: redis-server --maxmemory-policy noeviction
    networks:
      - monorepo-dev

  flower:
    image: mher/flower:2.0
    # Bound to loopback: the Flower dashboard has no authentication configured.
    ports:
      - "127.0.0.1:5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - redis
    networks:
      - monorepo-dev

  qdrant:
    image: qdrant/qdrant:latest
    # Bound to loopback: Qdrant has no API key configured.
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - monorepo-dev

volumes:
  qdrant_data:

networks:
  monorepo-dev:
    name: monorepo-dev