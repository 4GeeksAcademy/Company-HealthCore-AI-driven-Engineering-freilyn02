<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HealthCore | Data Utilities Test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="m-0 box-border bg-[radial-gradient(circle_at_top_left,rgba(255,106,61,0.12),transparent_30%),linear-gradient(180deg,#fff8ef_0%,#f3ede5_100%)] font-[Manrope] leading-[1.6] text-[#101010]">

  <header class="sticky top-0 z-[100] flex items-center justify-between gap-4 border-b border-[rgba(16,16,16,0.06)] bg-[rgba(255,250,243,0.82)] px-[5%] py-[18px] backdrop-blur-[14px] min-[721px]:px-[8%]">
    <div class="font-[Space_Grotesk] text-[1.55rem] font-bold tracking-[-0.04em]">Health<span class="text-[#ff6a3d]">Core</span></div>
    <p class="font-semibold text-[#5f5a54]">Data Utilities Test</p>
  </header>

  <section class="px-[5%] py-[64px] min-[721px]:px-[8%]">
    <div class="mx-auto max-w-[900px]">
      <p class="mb-[18px] inline-block text-[0.78rem] font-extrabold uppercase tracking-[0.14em] text-[#ff6a3d]">Milestone 2</p>
      <h1 class="mb-8 font-[Space_Grotesk] text-[clamp(2rem,4vw,3.4rem)] leading-none tracking-[-0.05em]">Candidate data utilities</h1>

      <div class="mb-8 grid grid-cols-1 gap-[18px] min-[721px]:grid-cols-2">
        <div class="rounded-[28px] border border-[rgba(16,16,16,0.06)] bg-white p-7 shadow-[0_14px_30px_rgba(16,16,16,0.05)]">
          <h2 class="mb-4 text-[1.1rem] font-bold">Filter + Sort</h2>
          <button id="btn-filter" class="inline-flex min-h-[44px] items-center justify-center rounded-full bg-[#ff6a3d] px-5 py-2 font-extrabold text-white transition hover:-translate-y-0.5 hover:bg-[#e4542c]">Filter selected, sort by experience</button>
        </div>

        <div class="rounded-[28px] border border-[rgba(16,16,16,0.06)] bg-white p-7 shadow-[0_14px_30px_rgba(16,16,16,0.05)]">
          <h2 class="mb-4 text-[1.1rem] font-bold">Search</h2>
          <button id="btn-search" class="inline-flex min-h-[44px] items-center justify-center rounded-full bg-[#ff6a3d] px-5 py-2 font-extrabold text-white transition hover:-translate-y-0.5 hover:bg-[#e4542c]">Linear + binary search demo</button>
        </div>

        <div class="rounded-[28px] border border-[rgba(16,16,16,0.06)] bg-white p-7 shadow-[0_14px_30px_rgba(16,16,16,0.05)]">
          <h2 class="mb-4 text-[1.1rem] font-bold">Report</h2>
          <button id="btn-report" class="inline-flex min-h-[44px] items-center justify-center rounded-full bg-[#ff6a3d] px-5 py-2 font-extrabold text-white transition hover:-translate-y-0.5 hover:bg-[#e4542c]">Generate candidate report</button>
        </div>

        <div class="rounded-[28px] border border-[rgba(16,16,16,0.06)] bg-white p-7 shadow-[0_14px_30px_rgba(16,16,16,0.05)]">
          <h2 class="mb-4 text-[1.1rem] font-bold">Validation</h2>
          <button id="btn-validate" class="inline-flex min-h-[44px] items-center justify-center rounded-full bg-[#ff6a3d] px-5 py-2 font-extrabold text-white transition hover:-translate-y-0.5 hover:bg-[#e4542c]">Validate sample candidates</button>
        </div>
      </div>

      <div class="rounded-[28px] border border-[rgba(16,16,16,0.06)] bg-[#171717] p-7 text-white shadow-[0_20px_50px_rgba(16,16,16,0.08)]">
        <p class="mb-3 text-[0.76rem] font-extrabold uppercase tracking-[0.12em] text-[rgba(255,255,255,0.7)]">Output</p>
        <pre id="output" class="whitespace-pre-wrap font-mono text-[0.85rem] text-[rgba(255,255,255,0.9)]">Click a button above to see results here.</pre>
      </div>
    </div>
  </section>

  <footer class="border-t border-[rgba(16,16,16,0.06)] px-5 py-7 text-center text-[0.9rem] text-[#5f5a54]">
    <p>&copy; 2026 HealthCore Digital.</p>
  </footer>

  <script type="module" src="./src/demo.ts"></script>
</body>
</html>
